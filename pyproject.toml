[project]
name = "rag-platform"
version = "0.1.0"
description = "Self-hosted multi-tenant RAG platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "structlog>=24.4",
    "tenacity>=9.0",
    "tiktoken>=0.7",
    "prometheus-fastapi-instrumentator>=7.0",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "minio>=7.2",
    "redis>=5.2",
    "qdrant-client>=1.12",
    "langchain-text-splitters>=0.3",
    "langfuse>=4.0,<5.0",
    "langgraph>=0.3",
    "langgraph-checkpoint-postgres>=2.0",
    "openai>=1.50",
    "cachetools>=5.3",
    "rank-bm25>=0.2",
    "fastembed>=0.4",
    "python-multipart>=0.0.32",
    "weasyprint>=69.0",
    "jinja2>=3.1.6",
    "fastapi-limiter==0.1.6",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "mypy>=1.12",
    "ruff>=0.7",
    "testcontainers[postgres,redis,minio]>=4.8",
    "factory-boy>=3.3",
    "aiosqlite>=0.20",
    "types-python-jose>=3.3",
    "types-redis>=4.6",
    "types-cachetools>=5.3",
    "cryptography>=42.0",
    "import-linter>=2.1",
    "ragas>=0.2",
    "datasets>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["src/db/migrations/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401", "PLW0603"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/", "src/db/migrations/"]

[[tool.mypy.overrides]]
module = ["rank_bm25", "fastembed", "weasyprint"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
addopts = "-m 'not eval and not integration'"
markers = [
    "integration: requires testcontainers (Docker)",
    "tenant_isolation: blocker — must pass before merge",
    "auth: JWT/RBAC security tests",
    "eval: RAG evaluation tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/db/migrations/*"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# ---------------------------------------------------------------------------
# import-linter — enforces layered architecture: api → domain → core
# Forbidden directions: domain → api, core → api, core → domain
# ---------------------------------------------------------------------------
[tool.importlinter]
root_packages = ["src"]

[[tool.importlinter.contracts]]
name = "domain must not import from api"
type = "forbidden"
source_modules = ["src.domain"]
forbidden_modules = ["src.api"]

[[tool.importlinter.contracts]]
name = "core must not import from api"
type = "forbidden"
source_modules = ["src.core"]
forbidden_modules = ["src.api"]

[[tool.importlinter.contracts]]
name = "core must not import from domain"
type = "forbidden"
source_modules = ["src.core"]
forbidden_modules = ["src.domain"]

[[tool.importlinter.contracts]]
name = "graphs must not import from api"
type = "forbidden"
source_modules = ["src.graphs"]
forbidden_modules = ["src.api"]

[[tool.importlinter.contracts]]
name = "retrieval must not import from api"
type = "forbidden"
source_modules = ["src.retrieval"]
forbidden_modules = ["src.api"]

[[tool.importlinter.contracts]]
name = "ingest must not import from api"
type = "forbidden"
source_modules = ["src.ingest"]
forbidden_modules = ["src.api"]
