[project]
name = "rag-platform"
version = "0.1.0"
description = "Self-hosted multi-tenant RAG platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "structlog>=24.4",
    "prometheus-fastapi-instrumentator>=7.0",
    "httpx>=0.27",
    "python-jose[cryptography]>=3.3",
    "minio>=7.2",
    "redis>=5.2",
    "qdrant-client>=1.12",
    "langfuse>=2.0",
    "openai>=1.50",
    "cachetools>=5.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "mypy>=1.12",
    "ruff>=0.7",
    "testcontainers[postgres,redis,minio]>=4.8",
    "factory-boy>=3.3",
    "aiosqlite>=0.20",
    "types-python-jose>=3.3",
    "types-redis>=4.6",
    "types-cachetools>=5.3",
    "cryptography>=42.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["src/db/migrations/"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "ANN"]
ignore = ["ANN401", "PLW0603"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/", "src/db/migrations/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "integration: requires testcontainers (Docker)",
    "tenant_isolation: blocker — must pass before merge",
    "auth: JWT/RBAC security tests",
    "eval: RAG evaluation tests",
]

[tool.coverage.run]
source = ["src"]
omit = ["src/db/migrations/*"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
